<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多人旅遊分帳工具 Pro v2.7</title><style>
:root{--b:#2563eb;--g:#059669;--r:#dc2626;--ink:#123;--muted:#64748b;--line:#dbe4ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#eff6ff,#f8fafc 55%,#ecfdf5)}main{max-width:1380px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.hero h1{margin:0;font-size:clamp(26px,4vw,40px)}.badge{font-size:12px;background:#dbeafe;color:#1d4ed8;padding:4px 9px;border-radius:99px}.tools,.row,.chips,.checks,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select{font:inherit;border:1px solid var(--line);padding:10px;border-radius:10px;background:#fff}.btn{font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--b);color:#fff}.danger{color:var(--r)}.edit{color:#1d4ed8}.copy{color:#047857}.hide{display:none}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}.card{background:#fff;padding:17px;border-radius:16px;box-shadow:0 10px 30px #102a4313}.label,.hint{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:850;margin-top:5px}.section{margin-top:15px}.manage{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.chip{background:#eff6ff;padding:7px 10px;border-radius:99px}.chip button{border:0;background:none;color:var(--r)}h2{font-size:18px;margin:0 0 12px}.row input{flex:1;min-width:100px}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%}.span2{grid-column:span 2}.span6{grid-column:1/-1}.checks{border:1px dashed #cbd5e1;padding:8px;border-radius:10px}.checks label{background:#f8fafc;padding:6px 8px;border-radius:8px;font-size:13px}.analysis{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.lodging{display:none}.lodging.show{display:flex}.readonly{background:#f1f5f9;color:#334155;font-weight:800}.catgrid,.settles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cat,.settles>div{border:1px solid var(--line);padding:10px;border-radius:10px;background:#f8fafc}.cathead{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.bar{height:6px;background:#e2e8f0;margin-top:7px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--g))}.filters{align-items:end;padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.filter{display:flex;flex-direction:column;gap:4px;min-width:160px}.filter label{font-size:12px;color:var(--muted);font-weight:700}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{background:#f8fafc}.money{text-align:right}.pos{color:var(--g);font-weight:800}.neg{color:var(--r);font-weight:800}.editing{outline:2px solid #93c5fd;background:#eff6ff}.editnote{color:#1d4ed8;font-weight:700}.summary{display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap;padding:14px;background:#eff6ff;border-radius:0 0 12px 12px;font-weight:800}.summary strong{color:var(--b);font-size:20px}.persons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.person{border:1px solid var(--line);border-radius:12px;padding:14px}.personhead{display:flex;justify-content:space-between}.chart{display:grid;grid-template-columns:125px 1fr;gap:15px;align-items:center;margin-top:12px}.pie{width:120px;height:120px;border-radius:50%;position:relative}.pie:after{content:"";position:absolute;inset:25px;border-radius:50%;background:#fff}.legend{display:grid;gap:6px}.leg{display:grid;grid-template-columns:10px 1fr auto;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:3px}.empty{text-align:center;color:var(--muted);padding:18px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:20px}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.manage,.analysis,.persons{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 1}}@media(max-width:520px){main{padding:14px}.kpis,.form,.catgrid,.settles{grid-template-columns:1fr}.span2,.span6{grid-column:1}.chart{grid-template-columns:1fr;justify-items:center}.legend{width:100%}.filter{width:100%}}@media print{.tools,.entry,.action,.filters{display:none!important}.card{box-shadow:none;border:1px solid #ddd}body{background:#fff}}
</style></head><body><main><header class="hero"><div><h1>多人旅遊分帳工具 <span class="badge">Pro v2.7</span></h1><p class="hint">新增支出篩選、排序與動態加總。</p></div><div class="tools"><button class="btn" onclick="exportExcel()">匯出 Excel</button><button class="btn" onclick="exportCSV()">匯出 CSV</button><button class="btn" onclick="exportJSON()">備份 JSON</button><button class="btn" type="button" onclick="$('jsonFile').click()">匯入 JSON</button><input id="jsonFile" class="hide" type="file" accept=".json,application/json" onchange="importJSON(event)"><button class="btn" onclick="print()">列印 / PDF</button><button class="btn danger" onclick="clearAll()">清空</button></div></header>
<section class="kpis"><div class="card"><div class="label">總支出</div><div class="value" id="total">NT$0</div></div><div class="card"><div class="label">平均支出（共同支出）/ 人</div><div class="value" id="avg">NT$0</div></div><div class="card"><div class="label">支出筆數</div><div class="value" id="count">0</div></div><div class="card"><div class="label">旅伴人數</div><div class="value" id="pcount">0</div></div><div class="card"><div class="label">建議轉帳筆數</div><div class="value" id="tcount">0</div></div></section>
<section class="manage section"><div class="card"><h2>旅伴管理</h2><div class="chips" id="people"></div><div class="row" style="margin-top:12px"><input id="newPerson" placeholder="輸入姓名"><button class="btn" onclick="addItem('people','newPerson')">新增</button></div></div><div class="card"><h2>類別管理</h2><div class="chips" id="categoryList"></div><div class="row" style="margin-top:12px"><input id="newCategory" placeholder="輸入類別"><button class="btn" onclick="addItem('categories','newCategory')">新增</button></div></div><div class="card"><h2>地點管理</h2><div class="chips" id="locationList"></div><div class="row" style="margin-top:12px"><input id="newLocation" placeholder="輸入地點"><button class="btn" onclick="addItem('locations','newLocation')">新增</button></div></div></section>
<section class="card entry section"><h2>新增支出</h2><p class="editnote hide" id="editNote">目前正在修改支出紀錄</p><div class="form"><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>類別</label><select id="category" onchange="toggleLodgingFields()"></select></div><div class="field span2"><label>項目</label><input id="item" placeholder="例如：晚餐"></div><div class="field"><label>地點</label><select id="location"></select></div><div class="field"><label>總金額（手動輸入）</label><input id="amount" type="number" min="0" step=".01" oninput="updateNightlyRate()"></div><div class="field lodging" id="nightsWrap"><label>住宿晚數</label><input id="nights" type="number" min="1" step="1" placeholder="例如：3" oninput="updateNightlyRate()"></div><div class="field lodging" id="nightlyWrap"><label>每晚金額（自動計算）</label><input id="nightlyRate" class="readonly" type="text" value="NT$0" readonly></div><div class="field span2"><label>備註</label><input id="note" placeholder="例如：含城市稅"></div><div class="field"><label>付款人</label><select id="payer"></select></div><div class="field span6"><label>分攤人員</label><div class="checks" id="checks"></div></div><div class="span6"><button class="btn primary" id="saveBtn" onclick="saveExpense()">加入支出</button> <button class="btn hide" id="cancelBtn" onclick="cancelEdit()">取消修改</button> <button class="btn" onclick="selectAll(true)">全選</button> <button class="btn" onclick="selectAll(false)">清除</button></div></div></section>
<section class="analysis section"><div class="card"><h2>類別分析</h2><div class="catgrid" id="cats"></div></div><div class="card"><h2>地點分析</h2><div class="catgrid" id="locationAnalysis"></div></div><div class="card"><h2>建議清算</h2><div class="settles" id="settles"></div></div></section>
<section class="card section"><h2>支出明細</h2><div class="filters"><div class="filter"><label>類別篩選</label><select id="filterCategory" onchange="renderExpenses()"></select></div><div class="filter"><label>地點篩選</label><select id="filterLocation" onchange="renderExpenses()"></select></div><div class="filter"><label>關鍵字搜尋</label><input id="filterKeyword" placeholder="項目、備註、付款人" oninput="renderExpenses()"></div><div class="filter"><label>排序方式</label><select id="sortBy" onchange="renderExpenses()"><option value="date-desc">日期：新到舊</option><option value="date-asc">日期：舊到新</option><option value="category-asc">類別：A 到 Z</option><option value="category-desc">類別：Z 到 A</option><option value="amount-desc">金額：高到低</option><option value="amount-asc">金額：低到高</option></select></div><button class="btn" onclick="resetFilters()">清除篩選</button></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>類別</th><th>項目</th><th>地點</th><th>備註</th><th class="money">晚數</th><th class="money">每晚金額</th><th class="money">台幣</th><th>付款人</th><th>分攤人員</th><th class="money">每人</th><th class="action">操作</th></tr></thead><tbody id="expenseRows"></tbody></table></div><div class="summary"><span>目前篩選筆數：<strong id="filteredCount">0</strong> 筆</span><span>目前篩選加總：<strong id="filteredTotal">NT$0</strong></span></div></section>
<section class="card section"><h2>每人結餘</h2><div class="tablewrap"><table><thead><tr><th>姓名</th><th class="money">已付款</th><th class="money">應負擔</th><th class="money">淨額</th></tr></thead><tbody id="balances"></tbody></table></div></section><section class="card section"><h2>個人支出類別分析</h2><div class="persons" id="persons"></div></section><div class="footer">Pro v2.7 ｜ 資料儲存在目前瀏覽器，建議定期備份 JSON。</div></main>
<script>
const KEY='trip-splitter-pro-v2-7',DC=['餐費','交通','住宿','門票','觀光行程','其他'],DL=['基督城 Christchurch','皇后鎮 Queenstown','瓦納卡 Wanaka','蒂卡波湖 Lake Tekapo','庫克山(奧拉基) Mount Cook (Aoraki)','其他 Other'],COL=['#2563eb','#059669','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#84cc16','#f97316'];let state=load(),editing=null;function blank(){return{version:'2.7',people:[],categories:[...DC],locations:[...DL],expenses:[]}}function norm(x){x=x||blank();x.people=Array.isArray(x.people)?x.people:[];x.categories=Array.isArray(x.categories)&&x.categories.length?x.categories:[...DC];x.locations=Array.isArray(x.locations)&&x.locations.length?x.locations:[...DL];x.expenses=Array.isArray(x.expenses)?x.expenses:[];return x}function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}const $=id=>document.getElementById(id),v=id=>$(id).value,esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n||0),opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
function calc(){let b=Object.fromEntries(state.people.map(p=>[p,{paid:0,share:0,net:0}]));for(const e of state.expenses){if(!b[e.payer]||!e.participants.length)continue;b[e.payer].paid+=+e.amount;for(const p of e.participants)if(b[p])b[p].share+=e.amount/e.participants.length}for(const p of state.people)b[p].net=b[p].paid-b[p].share;return b}function transfers(b){let d=[],c=[],o=[];for(const[p,x]of Object.entries(b)){if(x.net<-.01)d.push([p,-x.net]);if(x.net>.01)c.push([p,x.net])}d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);let i=0,j=0;while(i<d.length&&j<c.length){let a=Math.min(d[i][1],c[j][1]);o.push({from:d[i][0],to:c[j][0],amount:a});d[i][1]-=a;c[j][1]-=a;if(d[i][1]<.01)i++;if(c[j][1]<.01)j++}return o}
function render(){let total=state.expenses.reduce((a,e)=>a+(+e.amount||0),0),shared=state.people.length?state.expenses.filter(e=>e.participants.length===state.people.length&&state.people.every(p=>e.participants.includes(p))).reduce((a,e)=>a+(+e.amount||0),0):0;$('total').textContent=fmt(total);$('avg').textContent=fmt(state.people.length?shared/state.people.length:0);$('count').textContent=state.expenses.length;$('pcount').textContent=state.people.length;list('people',state.people,'people');list('categoryList',state.categories,'categories');list('locationList',state.locations,'locations');$('category').innerHTML=opts(state.categories);$('location').innerHTML=opts(state.locations);$('payer').innerHTML=state.people.length?opts(state.people):'<option value="">請先新增旅伴</option>';$('checks').innerHTML=state.people.length?state.people.map(p=>`<label><input name="parts" type="checkbox" value="${esc(p)}" checked> ${esc(p)}</label>`).join(''):'<span class="hint">請先新增旅伴</span>';syncFilterOptions();let sums=Object.fromEntries(state.categories.map(c=>[c,0]));state.expenses.forEach(e=>sums[e.category]=(sums[e.category]||0)+(+e.amount||0));$('cats').innerHTML=state.categories.map(c=>`<div class="cat"><div class="cathead"><span>${esc(c)}</span><span>${fmt(sums[c])}</span></div><div class="bar"><i style="width:${total?sums[c]/total*100:0}%"></i></div></div>`).join('');let locSums=Object.fromEntries(state.locations.map(l=>[l,0]));state.expenses.forEach(e=>locSums[e.location]=(locSums[e.location]||0)+(+e.amount||0));$('locationAnalysis').innerHTML=state.locations.map(l=>`<div class="cat"><div class="cathead"><span>${esc(l)}</span><span>${fmt(locSums[l])}</span></div><div class="bar"><i style="width:${total?locSums[l]/total*100:0}%"></i></div></div>`).join('');renderExpenses();let b=calc();$('balances').innerHTML=state.people.length?state.people.map(p=>`<tr><td>${esc(p)}</td><td class="money">${fmt(b[p].paid)}</td><td class="money">${fmt(b[p].share)}</td><td class="money ${b[p].net>=0?'pos':'neg'}">${fmt(b[p].net)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">尚無資料</td></tr>';let t=transfers(b);$('tcount').textContent=t.length;$('settles').innerHTML=t.length?t.map(x=>`<div><b>${esc(x.from)}</b> 轉給 <b>${esc(x.to)}</b><p class="pos">${fmt(x.amount)}</p></div>`).join(''):'<div class="empty">目前不需轉帳</div>';renderPersons()}
function syncFilterOptions(){let c=$('filterCategory').value,l=$('filterLocation').value;$('filterCategory').innerHTML='<option value="">全部類別</option>'+opts(state.categories);$('filterLocation').innerHTML='<option value="">全部地點</option>'+opts(state.locations);if(state.categories.includes(c))$('filterCategory').value=c;if(state.locations.includes(l))$('filterLocation').value=l}function getFiltered(){let c=v('filterCategory'),l=v('filterLocation'),q=v('filterKeyword').trim().toLowerCase(),s=v('sortBy');let a=state.expenses.map((e,i)=>({...e,_i:i})).filter(e=>(!c||e.category===c)&&(!l||e.location===l)&&(!q||[e.item,e.note,e.payer,e.category,e.location].some(x=>String(x||'').toLowerCase().includes(q))));let [f,d]=s.split('-');a.sort((x,y)=>{let r=f==='amount'?x.amount-y.amount:String(x[f]||'').localeCompare(String(y[f]||''),'zh-Hant');return d==='desc'?-r:r});return a}function renderExpenses(){let a=getFiltered();$('expenseRows').innerHTML=a.length?a.map(e=>`<tr class="${editing===e._i?'editing':''}"><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.item)}</td><td>${esc(e.location)}</td><td>${esc(e.note)}</td><td class="money">${e.category==='住宿'&&e.nights?esc(e.nights):'-'}</td><td class="money">${e.category==='住宿'&&e.nights?fmt(e.amount/e.nights):'-'}</td><td class="money">${fmt(e.amount)}</td><td>${esc(e.payer)}</td><td>${e.participants.map(esc).join('、')}</td><td class="money">${fmt(e.amount/e.participants.length)}</td><td class="action"><button class="btn edit" onclick="editExpense(${e._i})">修改</button> <button class="btn copy" onclick="copyExpense(${e._i})">複製</button> <button class="btn danger" onclick="delExpense(${e._i})">刪除</button></td></tr>`).join(''):'<tr><td colspan="12" class="empty">沒有符合條件的支出</td></tr>';$('filteredCount').textContent=a.length;$('filteredTotal').textContent=fmt(a.reduce((x,e)=>x+(+e.amount||0),0))}function resetFilters(){$('filterCategory').value='';$('filterLocation').value='';$('filterKeyword').value='';$('sortBy').value='date-desc';renderExpenses()}
function list(id,a,k){$(id).innerHTML=a.length?a.map(x=>`<span class="chip">${esc(x)} <button onclick="removeItem('${k}','${encodeURIComponent(x)}')">×</button></span>`).join(''):'<span class="hint">尚無資料</span>'}function addItem(k,id){let x=v(id).trim();if(!x)return;if(state[k].includes(x))return alert('內容已存在');state[k].push(x);$(id).value='';save()}function removeItem(k,x){x=decodeURIComponent(x);let used=k==='people'?state.expenses.some(e=>e.payer===x||e.participants.includes(x)):state.expenses.some(e=>e[k==='categories'?'category':'location']===x);if(used)return alert('此項目已有支出紀錄，無法刪除');if(k!=='people'&&state[k].length<=1)return alert('至少保留一個項目');state[k]=state[k].filter(y=>y!==x);save()}
function toggleLodgingFields(){let show=v('category')==='住宿';$('nightsWrap').classList.toggle('show',show);$('nightlyWrap').classList.toggle('show',show);if(!show){$('nights').value='';$('nightlyRate').value='NT$0'}else updateNightlyRate()}function updateNightlyRate(){let amount=+v('amount')||0,nights=+v('nights')||0;$('nightlyRate').value=nights>0?fmt(amount/nights):'NT$0'}function formData(){let e={date:v('date'),category:v('category'),item:v('item').trim(),location:v('location'),note:v('note').trim(),amount:+v('amount'),nights:v('category')==='住宿'?+v('nights'):null,payer:v('payer'),participants:[...document.querySelectorAll('[name=parts]:checked')].map(x=>x.value)};if(!state.people.length)return alert('請先新增旅伴');if(!e.date||!e.item||!(e.amount>0)||!e.payer||!e.participants.length)return alert('請完整填寫必要欄位');if(e.category==='住宿'&&!(e.nights>0))return alert('住宿類別請填寫住宿晚數');return e}function saveExpense(){let e=formData();if(!e)return;if(editing===null)state.expenses.push(e);else state.expenses[editing]=e;resetForm();save()}function editExpense(i){let e=state.expenses[i];editing=i;$('date').value=e.date;$('item').value=e.item;$('note').value=e.note||'';$('amount').value=e.amount;render();$('category').value=e.category;$('location').value=e.location;$('payer').value=e.payer;$('nights').value=e.nights||'';toggleLodgingFields();updateNightlyRate();document.querySelectorAll('[name=parts]').forEach(x=>x.checked=e.participants.includes(x.value));$('saveBtn').textContent='儲存修改';$('cancelBtn').classList.remove('hide');$('editNote').classList.remove('hide');document.querySelector('.entry').scrollIntoView({behavior:'smooth'})}function copyExpense(i){let e=state.expenses[i];state.expenses.push({...e,item:e.item+'（副本）',participants:[...e.participants]});save()}function cancelEdit(){resetForm();render()}function resetForm(){editing=null;['item','note','amount','nights'].forEach(id=>$(id).value='');$('nightlyRate').value='NT$0';$('date').value=new Date().toISOString().slice(0,10);$('saveBtn').textContent='加入支出';$('cancelBtn').classList.add('hide');$('editNote').classList.add('hide')}function selectAll(z){document.querySelectorAll('[name=parts]').forEach(x=>x.checked=z)}function delExpense(i){if(confirm('確定刪除此筆支出？')){state.expenses.splice(i,1);if(editing===i)resetForm();else if(editing!==null&&editing>i)editing--;save()}}function clearAll(){if(confirm('確定清空所有資料？')){state=blank();resetForm();save()}}
function renderPersons(){$('persons').innerHTML=state.people.length?state.people.map(p=>{let d={};state.expenses.forEach(e=>{if(e.participants.includes(p))d[e.category]=(d[e.category]||0)+e.amount/e.participants.length});let es=Object.entries(d).filter(x=>x[1]>.01),tot=es.reduce((a,x)=>a+x[1],0),ang=0,g=es.map((x,i)=>{let end=ang+x[1]/tot*360,z=`${COL[i%COL.length]} ${ang}deg ${end}deg`;ang=end;return z}).join(','),pie=tot?`<div class="pie" style="background:conic-gradient(${g})"></div>`:'<div class="empty">尚無支出</div>',leg=es.map((x,i)=>`<div class="leg"><i class="dot" style="background:${COL[i%COL.length]}"></i><span>${esc(x[0])} (${(x[1]/tot*100).toFixed(1)}%)</span><b>${fmt(x[1])}</b></div>`).join('');return`<div class="person"><div class="personhead"><b>${esc(p)}</b><span><span class="label">個人總金額</span><br><b class="pos">${fmt(tot)}</b></span></div><div class="chart">${pie}<div class="legend">${leg}</div></div></div>`}).join(''):'<div class="empty">新增旅伴及支出後顯示</div>'}
function dl(n,t,m){let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:m}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function q(x){return'"'+String(x??'').replaceAll('"','""')+'"'}function rows(){return[['日期','類別','項目','地點','備註','住宿晚數','每晚金額','台幣總金額','付款人','分攤人員'],...state.expenses.map(e=>[e.date,e.category,e.item,e.location,e.note,e.nights||'',e.category==='住宿'&&e.nights?e.amount/e.nights:'',e.amount,e.payer,e.participants.join('|')])]}function exportCSV(){dl('多人旅遊分帳_v2.7.csv',rows().map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}function exportJSON(){dl('多人旅遊分帳_v2.7_備份.json',JSON.stringify(state,null,2),'application/json')}function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=norm(JSON.parse(r.result));resetForm();save()}catch{alert('格式不正確')}};r.readAsText(f)}function exportExcel(){let b=calc(),t=transfers(b),tabs={支出明細:rows(),個人結餘:[['姓名','已付款','應負擔','淨額'],...state.people.map(p=>[p,b[p].paid,b[p].share,b[p].net])],轉帳建議:[['付款人','收款人','金額'],...t.map(x=>[x.from,x.to,x.amount])]};let x='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+Object.entries(tabs).map(([n,rs])=>`<Worksheet ss:Name="${n}"><Table>${rs.map(r=>`<Row>${r.map(c=>`<Cell><Data ss:Type="${typeof c==='number'?'Number':'String'}">${esc(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`).join('')+'</Workbook>';dl('多人旅遊分帳_Pro_v2.7.xls',x,'application/vnd.ms-excel')}$('date').value=new Date().toISOString().slice(0,10);render();toggleLodgingFields();
